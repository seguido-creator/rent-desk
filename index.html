<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B3FA6">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rent Desk"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>Rent Desk</title>
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first ledger. Home = month summary panel + one card per flat.
   A flat opens into four tabs on a bottom bar: Payments, Reminders, Maintenance, Tenants.
   Boldness lives in one place: the blue summary panel. Everything else stays quiet. */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --surface-2:#F5F7F6; --ink:#15201E; --muted:#5B6B67; --line:#D8E0DD;
  --accent:#2450C8; --accent-ink:#FFFFFF; --accent-soft:#E3EAFB;
  --ok:#17803D; --ok-soft:#DDF3E5; --warn:#8A5A00; --warn-soft:#FBEBC8; --bad:#B42318; --bad-soft:#FBE0DC;
  --panel:#1B3FA6; --panel-ink:#FFFFFF; --panel-ok:#8BE0A8; --panel-track:rgba(255,255,255,.22);
  --font-body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412; --surface:#162220; --surface-2:#1C2B28; --ink:#E6EFEB; --muted:#93A59F; --line:#2A3B37;
    --accent:#8CA6FF; --accent-ink:#0B1230; --accent-soft:#1E2A52;
    --ok:#5CD08A; --ok-soft:#173826; --warn:#F0BD55; --warn-soft:#3B2E10; --bad:#FF8A7A; --bad-soft:#3D1B17;
    --panel:#1E3478; --panel-ink:#F2F6FF; --panel-ok:#7FE0A0; --panel-track:rgba(255,255,255,.18);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#162220; --surface-2:#1C2B28; --ink:#E6EFEB; --muted:#93A59F; --line:#2A3B37;
  --accent:#8CA6FF; --accent-ink:#0B1230; --accent-soft:#1E2A52;
  --ok:#5CD08A; --ok-soft:#173826; --warn:#F0BD55; --warn-soft:#3B2E10; --bad:#FF8A7A; --bad-soft:#3D1B17;
  --panel:#1E3478; --panel-ink:#F2F6FF; --panel-ok:#7FE0A0; --panel-track:rgba(255,255,255,.18);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 24px;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.has-tabs .app{padding-bottom:88px}
.app{max-width:560px;margin:0 auto;min-width:0}
h1,h2,h3,p{margin:0}
h1{font-size:26px;line-height:1.15;font-weight:700;text-wrap:balance}
h2{font-size:17px;font-weight:700}
h3{font-size:16px;font-weight:700}
a{color:var(--accent)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stack{display:grid;gap:12px}
.section{margin-top:22px;display:grid;gap:10px}
.section>header{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
button{font:inherit}
.btn{font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:10px;min-height:42px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{min-height:36px;padding:6px 11px;font-size:13px}
.btn.block{width:100%}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled],.btn.off{opacity:.5;pointer-events:none}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);width:40px;height:40px;border-radius:10px;font-size:20px;line-height:1;cursor:pointer}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{font-weight:600;text-decoration:none;padding:6px 0;display:inline-flex;gap:4px}
.brand{font-weight:700;font-size:15px;letter-spacing:.01em}
.mswitch{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mswitch strong{font-size:16px}
.panel{background:var(--panel);color:var(--panel-ink);border-radius:18px;padding:18px;display:grid;gap:8px}
.panel .eyebrow{color:inherit;opacity:.8}
.big{font-size:34px;line-height:1.05;font-weight:500}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .ok{background:var(--ok)}
.bar .part{background:var(--warn)}
.panel .bar{background:var(--panel-track)}
.panel .bar .ok{background:var(--panel-ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
a.card{color:inherit;text-decoration:none}
.flat-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.flat-top>div{min-width:0}
.flat-amt{text-align:right;font-weight:500;white-space:nowrap}
.flat-amt small{display:block;color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.todo{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--ink);text-decoration:none;font-weight:500}
.todo b{color:var(--accent)}
.banner{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:13px;display:flex;gap:10px;justify-content:space-between;align-items:center;background:var(--warn-soft);color:var(--ink)}
.banner.bad{background:var(--bad-soft)}
.t-row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px}
.t-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.t-head>div{min-width:0}
.t-name{font-weight:600;overflow-wrap:anywhere}
.t-amt{font-weight:500;white-space:nowrap}
.t-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.t-actions .wide{grid-column:1/-1}
.paylog{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.li>div{min-width:0;overflow-wrap:anywhere}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);padding:10px 4px;font-weight:600;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
textarea,input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:150px;resize:vertical;line-height:1.5}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.actions>*{flex:1 1 140px}
.err{color:var(--bad);font-size:13px;margin:4px 0 10px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs a{display:grid;justify-items:center;gap:2px;padding:7px 2px;border-radius:10px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;position:relative}
.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tabs .n{position:absolute;top:2px;right:calc(50% - 26px);min-width:18px;padding:0 5px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheet-root{position:fixed;inset:0;z-index:30}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:560px;margin:0 auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);
  padding:10px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;max-width:min(92vw,520px);font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast .btn{background:transparent;color:var(--bg);border-color:var(--bg)}
.empty{padding:22px 16px;border:1px dashed var(--line);border-radius:14px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--muted)}
.skel{height:84px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.skel{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}}
</style>
</head><body>
<div id="app" class="app"></div>
<nav id="tabs" class="tabs" aria-label="Flat sections" hidden></nav>
<div id="sheet" class="sheet-root" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input id="receipt-file" type="file" accept="image/*" hidden>

<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ym = d => d.getFullYear() + "-" + pad(d.getMonth() + 1);
const isoDate = d => ym(d) + "-" + pad(d.getDate());
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const today = () => midnight(new Date());
const shiftMonth = (m, k) => { const p = m.split("-").map(Number); return ym(new Date(p[0], p[1] - 1 + k, 1)); };
const monthLabel = m => { const p = m.split("-").map(Number); return new Date(p[0], p[1] - 1, 1).toLocaleDateString("en-GB", {month:"long", year:"numeric"}); };
const monthName = m => { const p = m.split("-").map(Number); return new Date(p[0], p[1] - 1, 1).toLocaleDateString("en-GB", {month:"long"}); };
const dueDateFor = (m, day) => { const p = m.split("-").map(Number); const last = new Date(p[0], p[1], 0).getDate(); return new Date(p[0], p[1] - 1, Math.min(Math.max(+day || 1, 1), last)); };
const daysBetween = (a, b) => Math.round((midnight(b) - midnight(a)) / 86400000);
const fmtDate = d => d.toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"});
const fmtShort = d => d.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
const money = n => "AED " + (Math.round((+n || 0) * 100) / 100).toLocaleString("en-US", {maximumFractionDigits:2});
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
const uid = p => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const first = n => (String(n || "").trim().split(/\s+/)[0]) || "po";
const phoneDigits = p => { let d = String(p || "").replace(/\D/g, ""); if (d.startsWith("00")) d = d.slice(2); if (/^05\d{8}$/.test(d)) d = "971" + d.slice(1); return d; };
const waShare = t => "https://wa.me/?text=" + encodeURIComponent(t);
const waTo = (p, t) => "https://wa.me/" + phoneDigits(p) + "?text=" + encodeURIComponent(t);
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

/* ---------- state ---------- */
const S = {
  db:null, sample:null, canImg:false, err:null, slow:false,
  flats:[], tenants:[], payments:[], tickets:[],
  loaded:{flats:false, tenants:false, payments:false, tickets:false},
  month: ym(new Date()), remKind:{}, showFixed:{}, undo:null, ctl:null, rfid:null, dirty:false, lastKey:""
};
const flatById = id => S.flats.find(f => f.id === id);
const tById = id => S.tenants.find(t => t.id === id);
const activeTenants = fid => S.tenants.filter(t => t.active !== false && (!fid || t.flatId === fid));
const paidOf = tid => sum(S.payments.filter(p => p.tenantId === tid), p => +p.amount || 0);

function tstat(t){
  const paid = paidOf(t.id), rent = +t.rent || 0;
  const st = rent > 0 && paid >= rent ? "paid" : paid > 0 ? "partial" : "unpaid";
  const due = dueDateFor(S.month, t.dueDay);
  const lateDays = st !== "paid" ? Math.max(daysBetween(due, today()), 0) : 0;
  return {paid, rent, bal: Math.max(rent - paid, 0), st, due, late: lateDays > 0, lateDays};
}
function flatStats(f){
  const ts = activeTenants(f.id).map(t => Object.assign({t}, tstat(t)));
  return {
    ts,
    expected: sum(ts, x => x.rent),
    collected: sum(ts, x => Math.min(x.paid, x.rent || x.paid)),
    nPaid: ts.filter(x => x.st === "paid").length,
    nPart: ts.filter(x => x.st === "partial").length,
    nUn: ts.filter(x => x.st === "unpaid").length,
    nLate: ts.filter(x => x.late).length
  };
}
const openTickets = fid => S.tickets.filter(k => k.status !== "fixed" && (!fid || k.flatId === fid));
function dueMode(fid){
  const c = {}; activeTenants(fid).forEach(t => { const d = +t.dueDay || 1; c[d] = (c[d] || 0) + 1; });
  let best = 1, n = 0; Object.keys(c).forEach(k => { if (c[k] > n) { n = c[k]; best = +k; } });
  return best;
}
function birthdaysFor(fid, windowDays){
  const out = [], td = today();
  activeTenants(fid).forEach(t => {
    if (!t.birthday || !/^\d\d-\d\d$/.test(t.birthday)) return;
    const mm = +t.birthday.slice(0, 2), dd = +t.birthday.slice(3);
    let d = new Date(td.getFullYear(), mm - 1, dd);
    if (d < td) d = new Date(td.getFullYear() + 1, mm - 1, dd);
    const n = daysBetween(td, d);
    if (n <= windowDays) out.push({t, date:d, in:n});
  });
  return out.sort((a, b) => a.in - b.in);
}
function autoKind(list){
  const td = today();
  if (list.some(x => x.late)) return "over";
  if (list.some(x => daysBetween(td, x.due) === 0)) return "due";
  return "head";
}

/* ---------- messages (Taglish, polite) ---------- */
function groupMsg(kind, f){
  const ml = monthName(S.month), due = fmtDate(dueDateFor(S.month, dueMode(f.id)));
  if (kind === "head") return "Magandang araw po, " + f.name + "! Paalala lang po: ang rent para sa " + ml + " ay due sa " + due + ". Pwede po sa cash o bank transfer. Kung bank transfer, paki-send po ang screenshot ng receipt sa akin sa private message para ma-record agad. Maraming salamat po!";
  if (kind === "due") return "Magandang araw po, " + f.name + "! Ngayong araw po ang due date ng rent para sa " + ml + ". Salamat po sa mga nakapagbayad na. Para sa iba, paki-settle po ngayong araw at i-send sa akin ang receipt sa private message. Maraming salamat po!";
  return "Magandang araw po, " + f.name + ". Paalala lang po na may ilang rent para sa " + ml + " na hindi pa naka-record. Kung nakapagbayad na po kayo, paki-send ang receipt sa akin sa private message. Kung may kailangan pong pag-usapan, message lang po. Salamat po!";
}
function privMsg(x){
  const ml = monthName(S.month);
  const when = x.late ? "ay due noong " + fmtDate(x.due) : "ay due sa " + fmtDate(x.due);
  return "Magandang araw po, " + first(x.t.name) + "! " + (x.late ? "Paalala lang po na" : "Friendly reminder po na") + " ang rent para sa " + ml + " (" + money(x.bal) + ") " + when + ". Kung nakapagbayad na po kayo, paki-send ang receipt dito. Salamat po!";
}
const cleanMsg = f => "Magandang araw po, " + f.name + "! Paalala po para sa lingguhang linis: paki-hugasan agad ang mga ginamit na plato, itapon ang basura bago matulog, at linisin ang banyo pagkatapos gamitin. Salamat po sa pakikipagtulungan para maayos at komportable ang bahay natin.";
const quietMsg = f => "Magandang araw po, " + f.name + "! Paalala po na ang quiet hours ay mula 10:00 PM hanggang 7:00 AM. Paki-hinaan po ang volume at dahan-dahan sa pagsara ng pinto. Salamat po sa pang-unawa!";
const thanksMsg = (t, p) => "Salamat po, " + first(t.name) + "! Natanggap ko na po ang bayad ninyong " + money(p.amount) + " para sa rent ng " + monthName(p.month) + ". Maraming salamat po! - Juls";
const bdayMsg = t => "Happy birthday po, " + first(t.name) + "! Wishing you good health, safe work, and many blessings this year. Enjoy your day po! - Juls";
const fixedMsg = (f, k) => "Update po sa " + f.name + ": na-ayos na po ang \"" + k.title + "\"" + (k.room ? " sa " + k.room : "") + ". Salamat po sa pasensya. Kung may iba pa pong issue, message lang po sa akin.";

/* ---------- ui bits ---------- */
let toastT = 0;
function toast(msg, undo){
  const el = $("#toast");
  el.innerHTML = "<span>" + esc(msg) + "</span>" + (undo ? '<button class="btn sm" data-act="toast-undo">Undo</button>' : "");
  el.hidden = false; S.undo = undo || null;
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.hidden = true; S.undo = null; }, undo ? 7000 : 3500);
}
function openSheet(title, html){
  const root = $("#sheet");
  root.innerHTML = '<div class="backdrop" data-act="close"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><div class="sheet-in"><div class="sheet-head"><h2>' + esc(title) + '</h2><button class="btn sm" data-act="close">Close</button></div>' + html + "</div></section>";
  root.hidden = false; $("#toast").hidden = true;
  const f = root.querySelector("input:not([type=hidden]),select,textarea");
  if (f && !/Mobi|Android|iPhone/.test(navigator.userAgent)) f.focus();
}
function closeSheet(){ if (S.ctl) { try { S.ctl.abort(); } catch (e) {} S.ctl = null; } const r = $("#sheet"); r.hidden = true; r.innerHTML = ""; }
function formErr(form, msg){ let e = form.querySelector(".err"); if (!e) { e = document.createElement("p"); e.className = "err"; form.insertBefore(e, form.querySelector(".actions")); } e.textContent = msg; }
function errText(e){
  const c = e && e.code;
  if (c === "auth") return "Google session expired. Sign in again.";
  if (c === "quota_exceeded") return "Storage is full. Remove old records first.";
  if (c === "invalid_argument") return "This view cannot change saved data.";
  if (c === "resource_exhausted") return "Too many changes at once. Wait a moment and try again.";
  return "Could not save. Check your connection and try again.";
}
async function put(path, data){ if (!S.db) { toast("Saving is not available in this view."); return false; } try { await S.db.doc(path).set(data); return true; } catch (e) { toast(errText(e)); return false; } }
async function del(path){ if (!S.db) return false; try { await S.db.doc(path).delete(); return true; } catch (e) { toast(errText(e)); return false; } }
const monthOptions = sel => [-1, 0, 1].map(k => { const m = shiftMonth(S.month, k); return '<option value="' + m + '"' + (m === sel ? " selected" : "") + ">" + monthLabel(m) + "</option>"; }).join("");
const field = (id, label, inner) => '<div class="field"><label for="' + id + '">' + label + "</label>" + inner + "</div>";

/* ---------- views ---------- */
function monthSwitch(){
  return '<div class="mswitch"><button class="icon-btn" data-act="month" data-dir="-1" aria-label="Previous month">&lsaquo;</button><strong>' + monthLabel(S.month) + '</strong><button class="icon-btn" data-act="month" data-dir="1" aria-label="Next month">&rsaquo;</button></div>';
}
function banners(){
  let h = "";
  if (S.err === "auth") h += '<div class="banner bad"><span>Your Google session expired.</span><button class="btn sm" data-act="signin">Sign in</button></div>';
  else if (S.err === "noclient") h += '<div class="banner bad"><span>Setup not finished: add your Google client ID in config.js.</span></div>';
  else if (S.err === "setup") h += '<div class="banner bad"><span>Google refused access. In Google Cloud, enable the Google Sheets API and the Google Drive API, then reopen the app.</span></div>';
  else if (S.err === "nodb") h += '<div class="banner bad"><span>Saving is not available in this view. Open Rent Desk from your Claude artifacts to keep your records.</span></div>';
  else if (S.err === "read") h += '<div class="banner bad"><span>Saved records could not be read. Reopen the page to try again.</span></div>';
  else if (S.slow) h += '<div class="banner"><span>Your saved records cannot be reached yet. What you see may be out of date.</span></div>';
  if (S.flats.some(f => f.sample)) h += '<div class="banner"><span>These are sample flats and tenants so you can try the flow. Add your own, then remove the samples.</span><button class="btn sm" data-act="clearsample">Remove</button></div>';
  return h;
}
function loading(){ return '<div class="stack" style="margin-top:16px"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>'; }

function viewHome(){
  const all = S.flats.map(f => ({f, s: flatStats(f)}));
  const expected = sum(all, x => x.s.expected), collected = sum(all, x => x.s.collected);
  const nPaid = sum(all, x => x.s.nPaid), nPart = sum(all, x => x.s.nPart), nUn = sum(all, x => x.s.nUn);
  const pct = expected > 0 ? Math.min(collected / expected * 100, 100) : 0;
  let h = '<div class="topbar"><span class="brand">Rent Desk</span></div>' + banners();
  h += '<div class="stack" style="margin-top:6px">' + monthSwitch();
  h += '<section class="panel"><p class="eyebrow">Collected in ' + monthLabel(S.month) + '</p><p class="big mono">' + money(collected) + '</p><p class="small">of ' + money(expected) + ' expected across ' + all.length + ' flats</p><div class="bar" aria-hidden="true"><i class="ok" style="width:' + pct + '%"></i></div><p class="small">' + nPaid + ' paid &middot; ' + nPart + ' partial &middot; ' + nUn + ' unpaid</p></section></div>';
  if (!S.loaded.flats) return h + loading();

  const todo = [];
  if (S.month === ym(new Date())) {
    const td = today();
    all.forEach(x => {
      let head = 0, due = 0, over = 0;
      x.s.ts.filter(r => r.st !== "paid").forEach(r => { const d = daysBetween(td, r.due); if (d === 3) head++; else if (d === 0) due++; else if (d < 0) over++; });
      if (head) todo.push({href:"#" + x.f.id + "-rem", text:x.f.name + ": send the 3-day heads-up", n:head + " unpaid"});
      if (due) todo.push({href:"#" + x.f.id + "-rem", text:x.f.name + ": rent is due today", n:due + " unpaid"});
      if (over) todo.push({href:"#" + x.f.id + "-rem", text:x.f.name + ": follow up on overdue rent", n:over + " overdue"});
      birthdaysFor(x.f.id, 0).forEach(b => todo.push({href:"#" + x.f.id + "-rem", text:"Birthday today: " + b.t.name + " (" + x.f.name + ")", n:"Greeting"}));
    });
    h += '<section class="section"><header><h2>To send today</h2></header>';
    h += todo.length ? '<div class="stack">' + todo.map(t => '<a class="todo" href="' + t.href + '"><span>' + esc(t.text) + '</span><b class="small">' + esc(t.n) + '</b></a>').join("") + "</div>" : '<p class="muted">Nothing to send today.</p>';
    h += "</section>";
  }
  h += '<section class="section"><header><h2>Flats</h2><div class="chips">' + (all.length > 1 ? '<button class="btn sm" data-act="bcast">Message several</button>' : '') + '<button class="btn sm" data-act="addflat">Add flat</button></div></header>';
  if (!all.length) h += '<div class="empty"><p>No flats yet.</p><button class="btn primary" data-act="addflat">Add your first flat</button><button class="btn" data-act="loadsample">Load sample data to try it</button></div>';
  else h += '<div class="stack">' + all.map(x => flatCard(x.f, x.s)).join("") + "</div>";
  return h + "</section>";
}
function flatCard(f, s){
  const open = openTickets(f.id).length;
  const okW = s.expected > 0 ? Math.min(s.collected / s.expected * 100, 100) : 0;
  const rooms = +f.rooms || 0, occ = s.ts.length;
  const chips = [];
  if (s.nPaid) chips.push('<span class="pill ok">' + s.nPaid + " paid</span>");
  if (s.nPart) chips.push('<span class="pill warn">' + s.nPart + " partial</span>");
  if (s.nLate) chips.push('<span class="pill bad">' + s.nLate + " overdue</span>");
  else if (s.nUn) chips.push('<span class="pill">' + s.nUn + " unpaid</span>");
  if (open) chips.push('<span class="pill acc">' + open + " open " + (open === 1 ? "fix" : "fixes") + "</span>");
  return '<a class="card" href="#' + f.id + '-pay"><div class="flat-top"><div><h3>' + esc(f.name) + '</h3><p class="muted small">' + (f.building ? esc(f.building) + " &middot; " : "") + occ + (rooms ? " of " + rooms + " rooms" : " tenants") + '</p></div><div class="flat-amt mono">' + money(s.collected) + "<small>of " + money(s.expected) + '</small></div></div><div class="bar" aria-hidden="true"><i class="ok" style="width:' + okW + '%"></i></div><div class="chips">' + (chips.join("") || '<span class="pill">No tenants yet</span>') + "</div></a>";
}

function viewFlat(f, tab){
  let h = '<div class="topbar"><a class="back" href="#home">&lsaquo; All flats</a></div>' + banners();
  h += '<header class="stack" style="margin-top:4px"><h1>' + esc(f.name) + '</h1><p class="muted small">' + (f.building ? esc(f.building) + " &middot; " : "") + (activeTenants(f.id).length) + (+f.rooms ? " of " + f.rooms + " rooms" : " tenants") + "</p></header>";
  if (!S.loaded.tenants) return h + loading();
  return h + (tab === "rem" ? viewRem(f) : tab === "fix" ? viewFix(f) : tab === "ten" ? viewTen(f) : viewPay(f));
}

function viewPay(f){
  const s = flatStats(f);
  const okW = s.expected > 0 ? Math.min(s.collected / s.expected * 100, 100) : 0;
  let h = '<div class="stack" style="margin-top:14px">' + monthSwitch();
  h += '<section class="card"><div class="flat-top"><div><p class="eyebrow">Collected</p><p class="big mono" style="font-size:26px">' + money(s.collected) + '</p></div><div class="flat-amt mono"><small>Expected</small>' + money(s.expected) + '</div></div><div class="bar" aria-hidden="true"><i class="ok" style="width:' + okW + '%"></i></div><p class="small muted">' + s.nPaid + " paid &middot; " + s.nPart + " partial &middot; " + s.nUn + " unpaid</p></section>";
  if (S.canImg) h += '<button class="btn primary block" data-act="receipt" data-fid="' + f.id + '">Add bank receipt</button><p class="small muted">Pick the screenshot of the transfer. The amount, date and sender are read for you to confirm.</p>';
  h += "</div>";
  if (!s.ts.length) return h + '<div class="empty" style="margin-top:16px"><p>No tenants in this flat yet.</p><a class="btn primary" href="#' + f.id + '-ten">Add tenants</a></div>';
  h += '<div class="stack" style="margin-top:16px">' + s.ts.slice().sort((a, b) => (a.t.room || "").localeCompare(b.t.room || "") || a.t.name.localeCompare(b.t.name)).map(x => payRow(x)).join("") + "</div>";
  return h;
}
function payRow(x){
  const t = x.t, logs = S.payments.filter(p => p.tenantId === t.id).sort((a, b) => (a.ts || 0) - (b.ts || 0));
  let pill;
  if (x.st === "paid") pill = '<span class="pill ok">Paid</span>';
  else if (x.late) pill = '<span class="pill bad">' + (x.st === "partial" ? "Partial, " : "") + "overdue " + x.lateDays + (x.lateDays === 1 ? " day" : " days") + "</span>";
  else if (x.st === "partial") pill = '<span class="pill warn">Partial, ' + money(x.bal) + " left</span>";
  else pill = '<span class="pill">Due ' + fmtShort(x.due) + "</span>";
  let h = '<article class="t-row"><div class="t-head"><div><div class="t-name">' + esc(t.name) + '</div><div class="small muted">' + (t.room ? esc(t.room) + " &middot; " : "") + "due " + fmtShort(x.due) + '</div></div><div style="text-align:right"><div class="t-amt mono">' + money(x.rent) + '</div><div style="margin-top:4px">' + pill + "</div></div></div>";
  if (x.st !== "paid") {
    h += '<div class="t-actions"><button class="btn" data-act="quick" data-method="cash" data-tid="' + t.id + '">Cash received</button><button class="btn" data-act="quick" data-method="bank" data-tid="' + t.id + '">Bank transfer</button><button class="btn sm wide" data-act="pay" data-tid="' + t.id + '">Other amount or date</button></div>';
  }
  logs.forEach(p => { h += '<div class="paylog"><span>' + (p.method === "cash" ? "Cash" : "Bank") + " " + money(p.amount) + " &middot; " + (p.date ? fmtShort(new Date(p.date + "T00:00:00")) : "") + (p.ref ? " &middot; ref " + esc(p.ref) : "") + '</span><span class="chips">' + (phoneDigits(t.phone) ? '<a class="btn sm" target="_blank" rel="noopener" href="' + waTo(t.phone, thanksMsg(t, p)) + '">Thank you</a>' : '') + '<button class="btn sm" data-act="undopay" data-pid="' + p.id + '">Undo</button></span></div>'; });
  return h + "</article>";
}

function viewRem(f){
  const ts = activeTenants(f.id).map(t => Object.assign({t}, tstat(t)));
  const unpaid = ts.filter(x => x.st !== "paid");
  const kind = S.remKind[f.id] || autoKind(unpaid);
  const text = groupMsg(kind, f);
  let h = '<div class="stack" style="margin-top:14px">' + monthSwitch() + "</div>";
  h += '<section class="section"><header><h2>Message to the group</h2></header><div class="seg" role="group" aria-label="Reminder type">';
  [["head", "3 days before"], ["due", "Due today"], ["over", "Overdue"]].forEach(k => { h += '<button data-act="seg" data-kind="' + k[0] + '" data-fid="' + f.id + '" aria-pressed="' + (kind === k[0]) + '">' + k[1] + "</button>"; });
  h += '</div><textarea id="rem-text" data-wa="rem-wa" aria-label="Group message">' + esc(text) + '</textarea><div class="actions"><button class="btn" data-act="copy" data-src="rem-text">Copy</button><a id="rem-wa" class="btn primary" target="_blank" rel="noopener" href="' + waShare(text) + '">Open WhatsApp</a></div><p class="small muted">Names are not listed in the group. Open WhatsApp, choose the ' + esc(f.name) + " group, and send.</p></section>";

  h += '<section class="section"><header><h2>Private follow-up</h2><span class="small muted">' + unpaid.length + " unpaid</span></header>";
  if (!unpaid.length) h += '<p class="muted">Everyone in this flat has paid for ' + monthName(S.month) + ".</p>";
  else h += '<ul class="list">' + unpaid.map(x => '<li class="li"><div><strong>' + esc(x.t.name) + '</strong><div class="small muted">' + (x.t.room ? esc(x.t.room) + " &middot; " : "") + money(x.bal) + (x.late ? " &middot; " + x.lateDays + " days late" : "") + "</div></div>" + (phoneDigits(x.t.phone) ? '<a class="btn sm primary" target="_blank" rel="noopener" href="' + waTo(x.t.phone, privMsg(x)) + '">WhatsApp</a>' : '<span class="pill">No number</span>') + "</li>").join("") + "</ul>";
  h += "</section>";

  const bd = birthdaysFor(f.id, 14);
  h += '<section class="section"><header><h2>Birthdays</h2><span class="small muted">next 14 days</span></header>';
  if (!bd.length) h += '<p class="muted">No birthdays in the next two weeks.</p>';
  else h += '<ul class="list">' + bd.map(b => '<li class="li"><div><strong>' + esc(b.t.name) + '</strong><div class="small muted">' + (b.in === 0 ? "Today" : fmtDate(b.date)) + '</div></div><button class="btn sm" data-act="msg" data-type="bday" data-tid="' + b.t.id + '" data-fid="' + f.id + '">Greeting</button></li>').join("") + "</ul>";
  h += "</section>";

  h += '<section class="section"><header><h2>House reminders</h2></header><div class="actions"><button class="btn" data-act="msg" data-type="clean" data-fid="' + f.id + '">Weekly cleanliness</button><button class="btn" data-act="msg" data-type="quiet" data-fid="' + f.id + '">Quiet hours</button></div></section>';
  return h;
}

function viewFix(f){
  const all = S.tickets.filter(k => k.flatId === f.id);
  const open = all.filter(k => k.status !== "fixed").sort((a, b) => (a.reported || "").localeCompare(b.reported || ""));
  const done = all.filter(k => k.status === "fixed").sort((a, b) => (b.fixedDate || "").localeCompare(a.fixedDate || ""));
  let h = '<section class="section"><header><h2>Open issues</h2><button class="btn primary sm" data-act="addfix" data-fid="' + f.id + '">Log issue</button></header>';
  if (!open.length) h += '<div class="empty"><p>No open issues in ' + esc(f.name) + ".</p></div>";
  else h += '<div class="stack">' + open.map(k => fixCard(k)).join("") + "</div>";
  h += "</section>";
  if (done.length) {
    const showAll = S.showFixed[f.id];
    h += '<section class="section"><header><h2>Fixed</h2><button class="btn sm" data-act="togglefixed" data-fid="' + f.id + '">' + (showAll ? "Hide" : "Show " + done.length) + "</button></header>";
    if (showAll) h += '<div class="stack">' + done.slice(0, 15).map(k => fixCard(k)).join("") + "</div>";
    h += "</section>";
  }
  return h;
}
function fixCard(k){
  const days = k.reported ? daysBetween(new Date(k.reported + "T00:00:00"), today()) : 0;
  const pill = k.status === "fixed" ? '<span class="pill ok">Fixed' + (k.fixedDate ? " " + fmtShort(new Date(k.fixedDate + "T00:00:00")) : "") + "</span>" : k.status === "doing" ? '<span class="pill warn">In progress</span>' : '<span class="pill bad">Open ' + days + (days === 1 ? " day" : " days") + "</span>";
  let h = '<article class="card"><div class="flat-top"><div><h3>' + esc(k.title) + '</h3><p class="small muted">' + (k.room ? esc(k.room) + " &middot; " : "") + "reported " + (k.reported ? fmtShort(new Date(k.reported + "T00:00:00")) : "") + "</p></div>" + pill + "</div>";
  if (k.detail) h += "<p>" + esc(k.detail) + "</p>";
  if (k.status === "fixed" && (k.cost || k.by)) h += '<p class="small muted">' + (k.cost ? "Cost " + money(k.cost) : "") + (k.cost && k.by ? " &middot; " : "") + (k.by ? "By " + esc(k.by) : "") + "</p>";
  h += '<div class="actions">';
  if (k.status === "open") h += '<button class="btn sm" data-act="fixstart" data-kid="' + k.id + '">Start work</button>';
  if (k.status !== "fixed") h += '<button class="btn sm primary" data-act="fixdone" data-kid="' + k.id + '">Mark fixed</button>';
  if (k.status === "fixed") h += '<button class="btn sm" data-act="msg" data-type="fixed" data-kid="' + k.id + '">Message group</button><button class="btn sm" data-act="reopen" data-kid="' + k.id + '">Reopen</button>';
  return h + "</div></article>";
}

function viewTen(f){
  const all = S.tenants.filter(t => t.flatId === f.id);
  const act = all.filter(t => t.active !== false).sort((a, b) => (a.room || "").localeCompare(b.room || "") || a.name.localeCompare(b.name));
  const out = all.filter(t => t.active === false);
  let h = '<section class="section"><header><h2>Tenants</h2><button class="btn primary sm" data-act="addtenant" data-fid="' + f.id + '">Add tenant</button></header>';
  if (!act.length) h += '<div class="empty"><p>No tenants yet.</p></div>';
  else h += '<ul class="list">' + act.map(t => '<li class="li"><div><strong>' + esc(t.name) + '</strong><div class="small muted">' + (t.room ? esc(t.room) + " &middot; " : "") + money(t.rent) + " &middot; due day " + (t.dueDay || 1) + (phoneDigits(t.phone) ? "" : " &middot; no number") + '</div></div><button class="btn sm" data-act="edittenant" data-tid="' + t.id + '">Edit</button></li>').join("") + "</ul>";
  h += "</section>";
  if (out.length) h += '<section class="section"><header><h2>Moved out</h2></header><ul class="list">' + out.map(t => '<li class="li"><div class="muted">' + esc(t.name) + '</div><button class="btn sm" data-act="edittenant" data-tid="' + t.id + '">Edit</button></li>').join("") + "</ul></section>";
  h += '<section class="section"><button class="btn" data-act="editflat" data-fid="' + f.id + '">Edit flat details</button></section>';
  return h;
}

function tabsHtml(f, cur){
  const unpaid = flatStats(f).ts.filter(x => x.late).length, open = openTickets(f.id).length;
  const ic = {
    pay:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',
    rem:'<svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
    fix:'<svg viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0-5 5L4 17l3 3 5.5-5.5a4 4 0 0 0 5-5l-2.5 2.5-2.5-.5-.5-2.5z"/></svg>',
    ten:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5.5a3 3 0 0 1 0 5M18 20a5 5 0 0 0-2.5-4.3"/></svg>'
  };
  const items = [["pay", "Payments", unpaid], ["rem", "Reminders", 0], ["fix", "Maintenance", open], ["ten", "Tenants", 0]];
  return '<div class="tabs-in">' + items.map(i => '<a href="#' + f.id + "-" + i[0] + '"' + (cur === i[0] ? ' aria-current="page"' : "") + ">" + ic[i[0]] + "<span>" + i[1] + "</span>" + (i[2] ? '<span class="n">' + i[2] + "</span>" : "") + "</a>").join("") + "</div>";
}

/* ---------- render ---------- */
function route(){
  const h = (location.hash || "").replace(/^#/, "");
  const m = /^(f[a-z0-9]+)-(pay|rem|fix|ten)$/.exec(h);
  return m ? {name:"flat", fid:m[1], tab:m[2]} : {name:"home"};
}
function render(){
  const ae = document.activeElement;
  if (ae && ae.closest && ae.closest("#app") && /^(TEXTAREA|INPUT|SELECT)$/.test(ae.tagName)) { S.dirty = true; return; }
  S.dirty = false;
  if (S.needLogin) { $("#app").innerHTML = signinHtml(); $("#tabs").hidden = true; document.body.classList.remove("has-tabs"); return; }
  const r = route(), app = $("#app");
  const f = r.name === "flat" ? flatById(r.fid) : null;
  document.body.classList.toggle("has-tabs", !!f);
  let h;
  if (r.name === "flat") h = f ? viewFlat(f, r.tab) : (S.loaded.flats ? '<div class="topbar"><a class="back" href="#home">&lsaquo; All flats</a></div><div class="empty" style="margin-top:16px"><p>This flat was not found.</p></div>' : '<div class="topbar"><a class="back" href="#home">&lsaquo; All flats</a></div>' + loading());
  else h = viewHome();
  app.innerHTML = h;
  const tabs = $("#tabs");
  tabs.hidden = !f; tabs.innerHTML = f ? tabsHtml(f, r.tab) : "";
  const key = r.name + (r.fid || "") + (r.tab || "");
  if (key !== S.lastKey) { S.lastKey = key; window.scrollTo(0, 0); }
}
let raf = 0;
function schedule(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(render); }

/* ---------- sheets and forms ---------- */
function paySheet(tid){
  const t = tById(tid); if (!t) return;
  const s = tstat(t);
  openSheet("Record payment", '<p class="muted small" style="margin-bottom:12px">' + esc(t.name) + (t.room ? " &middot; " + esc(t.room) : "") + " &middot; " + money(s.bal) + " left for " + monthName(S.month) + '</p><form data-form="pay" data-tid="' + t.id + '">' +
    field("pay-amount", "Amount (AED)", '<input id="pay-amount" name="amount" type="number" inputmode="decimal" step="0.01" min="0" value="' + s.bal + '" required>') +
    '<div class="grid2">' + field("pay-method", "Method", '<select id="pay-method" name="method"><option value="cash">Cash</option><option value="bank">Bank transfer</option></select>') + field("pay-date", "Date received", '<input id="pay-date" name="date" type="date" value="' + isoDate(new Date()) + '" required>') + "</div>" +
    field("pay-month", "Counts toward", '<select id="pay-month" name="month">' + monthOptions(S.month) + "</select>") +
    field("pay-ref", "Reference or note (optional)", '<input id="pay-ref" name="ref" type="text">') +
    '<div class="actions"><button class="btn primary" type="submit">Save payment</button></div></form>');
}
async function savePay(form){
  const t = tById(form.dataset.tid), v = form.elements;
  const amount = +v.amount.value;
  if (!(amount > 0)) return formErr(form, "Enter an amount above zero.");
  const id = uid("p");
  const ok = await put("payments/" + id, {tenantId:t.id, flatId:t.flatId, month:v.month.value, amount, method:v.method.value, date:v.date.value, ref:v.ref.value.trim(), note:"", ts:Date.now()});
  if (ok) { closeSheet(); toast(money(amount) + " recorded for " + first(t.name) + (v.month.value !== S.month ? " (" + monthName(v.month.value) + ")" : "") + ".", () => del("payments/" + id)); }
}
async function quick(tid, method){
  const t = tById(tid); if (!t) return;
  const s = tstat(t);
  if (s.bal <= 0) return toast("Already paid in full.");
  const id = uid("p");
  const ok = await put("payments/" + id, {tenantId:t.id, flatId:t.flatId, month:S.month, amount:s.bal, method, date:isoDate(new Date()), ref:"", note:"", ts:Date.now()});
  if (ok) toast((method === "cash" ? "Cash " : "Bank transfer ") + money(s.bal) + " recorded for " + first(t.name) + ".", () => del("payments/" + id));
}

async function readReceipt(file, fid){
  if (!S.sample || !S.canImg) return toast("Receipt reading is not available in this view.");
  const f = flatById(fid), ts = activeTenants(fid);
  const ctl = new AbortController(); S.ctl = ctl;
  openSheet("Reading receipt", '<p class="muted">Reading the receipt. This takes a few seconds.</p><div class="actions"><button class="btn" data-act="close">Stop</button></div>');
  const list = ts.map(t => t.id + " | " + t.name + " | " + (t.room || "") + " | AED " + t.rent).join("\n");
  const prompt = "You read bank transfer receipt screenshots from UAE and Philippine bank apps for a landlord.\nToday is " + isoDate(new Date()) + ".\nTenants of " + f.name + " (id | name | room | monthly rent):\n" + list + "\n\nLook at the image and reply with ONLY one JSON object with these keys:\n{\"amount\": number or null, \"currency\": string or null, \"date\": \"YYYY-MM-DD\" or null, \"sender\": string or null, \"reference\": string or null, \"status\": \"successful\" | \"pending\" | \"failed\" | \"unknown\", \"tenantId\": one of the ids above or null, \"confidence\": \"high\" | \"medium\" | \"low\", \"notes\": short string}\nRules: Match tenantId using the sender name (allow different name order, middle names, initials) or a name or room written in the reference. If you cannot match with reasonable confidence, use null. Never output account numbers, IBANs or card numbers. If the image is not a bank transfer receipt, set amount to null and say so in notes.";
  try {
    const r = await S.sample.json(prompt, {images:file, signal:ctl.signal, cache:false});
    if (S.ctl !== ctl) return;
    S.ctl = null; receiptForm(fid, r, null);

    if (e && e.code === "cancelled") return;

function receiptForm(fid, r, err){
  const ts = activeTenants(fid).sort((a, b) => (a.room || "").localeCompare(b.room || "") || a.name.localeCompare(b.name));
  const x = r && typeof r === "object" ? r : {};
  const known = ts.some(t => t.id === x.tenantId);
  const amount = +x.amount > 0 ? +x.amount : "";
  const date = /^\d{4}-\d\d-\d\d$/.test(x.date || "") ? x.date : isoDate(new Date());
  const dup = x.reference && S.payments.some(p => p.ref && p.ref === x.reference);
  let note = "";
  if (err) {
    const c = err.code;
    note = c === "not_granted" ? "Claude access was not allowed for this page, so enter the payment yourself." : c === "rate_limited" ? "Too many reads right now. Wait a minute or enter the payment yourself." : c === "image_rejected" ? "That file is not a supported image." : "The receipt could not be read clearly. Enter the details yourself.";
  } else if (!amount) note = x.notes ? String(x.notes) : "No amount found. Enter it yourself.";
  const warns = [];
  if (!err && x.status && x.status !== "successful" && x.status !== "unknown") warns.push("The receipt shows the transfer as " + x.status + ".");
  if (!err && x.confidence === "low") warns.push("Low confidence. Check every field.");
  if (!err && amount && !known) warns.push("No tenant matched the sender" + (x.sender ? " (" + x.sender + ")" : "") + ". Choose one.");
  if (dup) warns.push("A payment with this reference is already recorded.");
  const sel = '<option value=""' + (known ? "" : " selected") + ">Choose tenant</option>" + ts.map(t => '<option value="' + t.id + '"' + (t.id === x.tenantId ? " selected" : "") + ">" + esc(t.name) + (t.room ? " (" + esc(t.room) + ")" : "") + "</option>").join("");
  openSheet("Confirm payment",
    (note ? '<p class="err" style="margin-top:0">' + esc(note) + "</p>" : "") + warns.map(w => '<p class="small" style="margin-bottom:8px"><span class="pill warn">Check</span> ' + esc(w) + "</p>").join("") +
    (x.sender ? '<p class="small muted" style="margin-bottom:10px">Sender on receipt: ' + esc(x.sender) + "</p>" : "") +
    '<form data-form="receipt" data-fid="' + fid + '">' + field("rc-tenant", "Tenant", '<select id="rc-tenant" name="tenant" required>' + sel + "</select>") +
    '<div class="grid2">' + field("rc-amount", "Amount (AED)", '<input id="rc-amount" name="amount" type="number" inputmode="decimal" step="0.01" min="0" value="' + amount + '" required>') + field("rc-date", "Date", '<input id="rc-date" name="date" type="date" value="' + date + '" required>') + "</div>" +
    field("rc-month", "Counts toward", '<select id="rc-month" name="month">' + monthOptions(S.month) + "</select>") +
    field("rc-ref", "Reference (optional)", '<input id="rc-ref" name="ref" type="text" value="' + esc(x.reference || "") + '">') +
    '<div class="actions"><button class="btn primary" type="submit">Save payment</button></div></form>');
}

async function gapi(url, opt){
  opt = opt || {};
  let r;
  try { r = await fetch(url, {method:opt.method || "GET", headers:Object.assign({Authorization:"Bearer " + GS.token}, opt.body ? {"Content-Type":"application/json"} : {}), body:opt.body ? JSON.stringify(opt.body) : undefined}); }
  catch (e) { throw {code:"network"}; }
  if (r.status === 401) { if (GS.started) { S.err = "auth"; schedule(); } throw {code:"auth"}; }
  if (r.status === 429) throw {code:"resource_exhausted"};
  if (!r.ok) throw {code:"http", status:r.status};
  return r.status === 204 ? null : r.json();
}
async function ensureSheet(){
  let id = null; try { id = localStorage.getItem("rd_sheet"); } catch (e) {}
  if (id) { try { await gapi(SH + "/" + id + "?fields=spreadsheetId"); return id; } catch (e) { if (e.code === "auth" || e.code === "network") throw e; id = null; } }
  const q = encodeURIComponent("name='Rent Desk Data' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false");
  const l = await gapi("https://www.googleapis.com/drive/v3/files?q=" + q + "&fields=files(id)&orderBy=createdTime");
  if (l.files && l.files.length) id = l.files[0].id;
  else {
    const hdr = {startRow:0, startColumn:0, rowData:[{values:[{userEnteredValue:{stringValue:"id"}}, {userEnteredValue:{stringValue:"data"}}]}]};
    const c = await gapi(SH, {method:"POST", body:{properties:{title:"Rent Desk Data"}, sheets:COLS.map(n => ({properties:{title:n}, data:[hdr]}))}});
    id = c.spreadsheetId;
  }
  try { localStorage.setItem("rd_sheet", id); } catch (e) {}
  return id;
}
async function loadAll(){
  const r = await gapi(SH + "/" + GS.sheetId + "/values:batchGet?" + COLS.map(c => "ranges=" + c + "!A2:B").join("&"));
  (r.valueRanges || []).forEach((vr, i) => {
    const c = COLS[i]; GS.cache[c] = new Map(); GS.rows[c] = {};
    (vr.values || []).forEach((row, k) => { if (!row || !row[0] || !row[1]) return; try { GS.cache[c].set(row[0], JSON.parse(row[1])); GS.rows[c][row[0]] = k + 2; } catch (e) {} });
  });
}
function snapOf(c, w){
  const docs = [];
  GS.cache[c].forEach((d, id) => { if (!w || w.every(x => d[x[0]] === x[2])) docs.push({id, data:() => clone(d)}); });
  return {docs, metadata:{fromCache:false}};
}
function fire(){ GS.subs.forEach(s => s.cb(snapOf(s.c, s.w))); }
const enqueue = fn => { const p = GS.chain.then(fn); GS.chain = p.catch(() => {}); return p; };
function gsSet(c, id, data){
  return enqueue(async () => {
    const prev = GS.cache[c].get(id), row = GS.rows[c][id];
    GS.cache[c].set(id, clone(data)); fire();
    try {
      const vals = {values:[[id, JSON.stringify(data)]]};
      if (row) await gapi(SH + "/" + GS.sheetId + "/values/" + c + "!A" + row + ":B" + row + "?valueInputOption=RAW", {method:"PUT", body:vals});
      else {
        const r = await gapi(SH + "/" + GS.sheetId + "/values/" + c + "!A:B:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS", {method:"POST", body:vals});
        const m = /!A(\d+)/.exec((r && r.updates && r.updates.updatedRange) || ""); if (m) GS.rows[c][id] = +m[1];
      }
    } catch (e) { if (prev) GS.cache[c].set(id, prev); else GS.cache[c].delete(id); fire(); throw e; }
  });
}
function gsDel(c, id){
  return enqueue(async () => {
    const prev = GS.cache[c].get(id), row = GS.rows[c][id];
    GS.cache[c].delete(id); fire();
    try { if (row) { await gapi(SH + "/" + GS.sheetId + "/values/" + c + "!A" + row + ":B" + row + ":clear", {method:"POST", body:{}}); delete GS.rows[c][id]; } }
    catch (e) { if (prev) GS.cache[c].set(id, prev); fire(); throw e; }
  });
}
function coll(c, w){
  return {
    where:(f, o, v) => coll(c, (w || []).concat([[f, o, v]])),
    onSnapshot:cb => { const s = {c, w, cb}; GS.subs.push(s); setTimeout(() => cb(snapOf(c, w)), 0); return () => { const k = GS.subs.indexOf(s); if (k >= 0) GS.subs.splice(k, 1); }; },
    get:async () => snapOf(c, w)
  };
}
const makeDb = () => ({collection:c => coll(c), doc:p => { const a = p.split("/"); return {set:d => gsSet(a[0], a[1], d), delete:() => gsDel(a[0], a[1])}; }});

function onToken(resp){
  if (!resp || resp.error || !resp.access_token) return;
  GS.token = resp.access_token;
  try { localStorage.setItem("rd_signed", "1"); } catch (e) {}
  clearTimeout(GS.timer);
  GS.timer = setTimeout(() => signIn(true), Math.max(((+resp.expires_in || 3600) - 180), 60) * 1000);
  if (GS.started) { if (S.err === "auth") { S.err = null; schedule(); } return; }
  startData();
}
function signIn(silent){
  if (!window.google || !google.accounts || !google.accounts.oauth2) { if (!silent) toast("Google sign-in is still loading. Try again in a moment."); return; }
  if (!GS.tc) GS.tc = google.accounts.oauth2.initTokenClient({client_id:CFG.clientId, scope:"https://www.googleapis.com/auth/drive.file", callback:onToken, error_callback:() => { if (!silent) toast("Sign-in was cancelled."); }});
  GS.tc.requestAccessToken({prompt:silent ? "none" : ""});
}
async function startData(){
  S.needLogin = false; S.err = null; render();
  try { GS.sheetId = await ensureSheet(); await loadAll(); }
  catch (e) {
    S.loaded = {flats:true, tenants:true, payments:true, tickets:true};
    if (e.code === "auth") { S.needLogin = true; } else S.err = e.status === 403 ? "setup" : "read";
    return render();
  }
  S.db = makeDb(); GS.started = true;
  subList("flats", "flats", (a, b) => (a.order || 0) - (b.order || 0) || String(a.name).localeCompare(String(b.name), undefined, {numeric:true}));
  subList("tenants", "tenants");
  subList("tickets", "tickets");
  subPayments();
  render();
}
async function loadSample(){
  if (!S.db) return;
  toast("Loading sample data...");
  const m = S.month, d1 = m + "-01", d2 = m + "-02", L = [];
  for (let i = 1; i <= 6; i++) L.push(["flats/f" + i, {name:"Flat " + i, building:"Sample building", rooms:3, order:i, sample:true}]);
  [["t1a","f1","Sample Tenant 1A","Room A",1600,1],["t1b","f1","Sample Tenant 1B","Room B",1500,1],["t1c","f1","Sample Tenant 1C","Room C",1500,5],["t2a","f2","Sample Tenant 2A","Room A",1700,3],["t2b","f2","Sample Tenant 2B","Room B",1600,3],["t3a","f3","Sample Tenant 3A","Room A",1400,1]]
    .forEach(t => L.push(["tenants/" + t[0], {flatId:t[1], name:t[2], room:t[3], rent:t[4], dueDay:t[5], phone:"", birthday:"", active:true, sample:true}]));
  L.push(["payments/p1a", {tenantId:"t1a", flatId:"f1", month:m, amount:1600, method:"cash", date:d1, ref:"", note:"", ts:1, sample:true}]);
  L.push(["payments/p1b", {tenantId:"t1b", flatId:"f1", month:m, amount:800, method:"bank", date:d2, ref:"", note:"", ts:2, sample:true}]);
  L.push(["tickets/k1", {flatId:"f1", room:"Room B", title:"AC not cooling", detail:"", status:"open", reported:d2, cost:0, by:"", fixedDate:"", ts:3, sample:true}]);
  for (const x of L) { if (!(await put(x[0], x[1]))) return; }
  toast("Sample data loaded.");
}
async function init(){
  render();
  if (!CFG.clientId || /PASTE/i.test(CFG.clientId)) { S.err = "noclient"; S.loaded = {flats:true, tenants:true, payments:true, tickets:true}; return render(); }
  S.needLogin = true; render();
  let hint = false; try { hint = localStorage.getItem("rd_signed") === "1"; } catch (e) {}
  let n = 0; const t = setInterval(() => { n++; if (window.google && google.accounts && google.accounts.oauth2) { clearInterval(t); if (hint) signIn(true); } else if (n > 50) clearInterval(t); }, 200);
}
init();
})();
</script>
